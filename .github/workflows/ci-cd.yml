name: portafolio-web-ci/cd

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Cancela ejecuciones previas del mismo ref, excepto deploys en main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Permisos mínimos: solo lectura del repositorio
permissions:
  contents: read

jobs:
  lint:
    name: Biome
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Biome CI
        run: bunx biome ci .

  test:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run tests
        run: bun run test

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, test]
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build
        run: bun run build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
      - name: Deploy to Cloudflare Pages
        run: bunx wrangler pages deploy dist/ --project-name=ivandev-srvcs --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ---------------------------------------------------------------------------
  # Escaneo de secretos. Workflow reutilizable definido en ivndv/.github
  # ---------------------------------------------------------------------------
  gitleaks:
    uses: ivndv/.github/.github/workflows/gitleaks.yml@main
